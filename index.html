<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>俊輝電梯 — 施工進度日報</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang HK',sans-serif;background:#0d0f12;color:#e8eaf0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px}
.header{text-align:center;margin-bottom:24px;padding-top:12px}
.company{font-size:17px;font-weight:700;color:#f0c000}
.subtitle{font-size:12px;color:#555d6e;margin-top:3px}
.card{background:#13161c;border:1px solid #1e2330;border-radius:14px;padding:20px;width:100%;max-width:480px;margin-bottom:14px}
.badge{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:14px;background:#0d0f12;border-radius:10px;border:1px solid #2a3045}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
.lbl{display:block;font-size:11px;color:#9aa0b4;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;font-weight:600}
.inp{width:100%;background:#0d0f12;border:1px solid #2a3045;border-radius:10px;color:#e8eaf0;font-size:15px;padding:12px 14px;outline:none;-webkit-appearance:none;margin-bottom:14px}
.inp:focus{border-color:#f0c000}
select.inp option{background:#13161c}
textarea.inp{resize:none;height:100px;font-family:inherit}
.pct-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pct-row input[type=range]{flex:1;accent-color:#f0c000;height:6px}
.pct-val{font-size:20px;font-weight:800;color:#f0c000;min-width:48px;text-align:right}
.pct-bar{height:6px;background:#1e2330;border-radius:3px;margin-bottom:14px;overflow:hidden}
.pct-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#f0c000,#22c55e);transition:width .3s;border-radius:3px}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.status-btn{padding:10px;border-radius:8px;border:2px solid #2a3045;background:transparent;color:#9aa0b4;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s}
.status-btn.sel{border-color:#f0c000;background:#1a1500;color:#f0c000}
.btn-submit{width:100%;background:#f0c000;color:#0d0f12;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px}
.btn-submit:disabled{opacity:0.4;cursor:not-allowed}
.success{text-align:center;padding:32px 16px}
.sum{background:#0d0f12;border:1px solid #1e2330;border-radius:10px;padding:14px;margin:14px 0;text-align:left}
.sum-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid #1e2330}
.sum-row:last-child{border-bottom:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e05c5c;color:#fff;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{opacity:1}
.tag{display:inline-block;background:#1e2330;border:1px solid #2a3045;border-radius:20px;padding:3px 10px;font-size:11px;color:#9aa0b4;margin-right:6px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.tag.sel{background:#0a1525;border-color:#60a5fa;color:#60a5fa}
</style>
</head>
<body>
<div class="header">
  <div style="font-size:32px;margin-bottom:6px">&#x1F3D7;</div>
  <div class="company">巨揚工程有限公司</div>
  <div class="subtitle">施工進度日報</div>
</div>

<div id="errorScreen" style="display:none;text-align:center;padding:60px 20px">
  <div style="font-size:48px;margin-bottom:16px">⚠️</div>
  <div style="font-size:18px;font-weight:700;color:#e05c5c;margin-bottom:8px">連結無效</div>
  <div style="color:#555d6e;font-size:14px">請向主管索取正確嘅連結</div>
</div>

<div id="mainContent" style="width:100%;max-width:480px;display:none">
  <div class="card">
    <div class="badge">
      <div class="avatar" id="empAvatar">?</div>
      <div>
        <div style="font-size:16px;font-weight:700" id="empName">載入中...</div>
        <div style="font-size:11px;color:#555d6e;margin-top:2px" id="projName">施工負責人</div>
      </div>
    </div>

    <!-- Date -->
    <label class="lbl">📅 日期</label>
    <input type="date" class="inp" id="dateInp">

    <!-- Project -->
    <label class="lbl">🏗 工程項目</label>
    <select class="inp" id="projInp">
      <option value="">— 選擇工程 —</option>
      <option>EC-378 九龍東警察總部</option>
      <option>EC-391 Pine Street/Oak Street</option>
      <option>EC-399 銅鑼灣聖保祿醫院</option>
      <option>EC-413 黃竹坑</option>
      <option>EC-440 瓊林街</option>
      <option>EC-450 高士美道</option>
      <option>EC-456 將軍澳唐賢街</option>
      <option>EC-459 瑪麗醫院</option>
      <option>EC-468 荃灣柴灣角街天主教小學</option>
      <option>EC-474 啟德SOGO A座</option>
    </select>

    <!-- Progress -->
    <label class="lbl">📊 整體完成進度</label>
    <div class="pct-row">
      <input type="range" min="0" max="100" step="5" value="0" id="pctSlider" oninput="updPct()">
      <div class="pct-val" id="pctVal">0%</div>
    </div>
    <div class="pct-bar"><div class="pct-fill" id="pctFill" style="width:0%"></div></div>

    <!-- Status -->
    <label class="lbl">🚦 今日狀態</label>
    <div class="status-grid">
      <button class="status-btn" data-s="正常施工" onclick="selStatus(this)">✅ 正常施工</button>
      <button class="status-btn" data-s="延誤" onclick="selStatus(this)">⚠️ 延誤</button>
      <button class="status-btn" data-s="待料" onclick="selStatus(this)">📦 待料</button>
      <button class="status-btn" data-s="惡劣天氣停工" onclick="selStatus(this)">🌧 天氣停工</button>
      <button class="status-btn" data-s="驗收檢查" onclick="selStatus(this)">🔍 驗收檢查</button>
      <button class="status-btn" data-s="完工" onclick="selStatus(this)">🏁 完工</button>
    </div>

    <!-- Today's work -->
    <label class="lbl">📝 今日工作內容</label>
    <textarea class="inp" id="workInp" placeholder="例：完成導軌安裝、進行曳引機測試..."></textarea>

    <!-- Issues -->
    <label class="lbl">⚠️ 問題／跟進事項（可選）</label>
    <textarea class="inp" id="issueInp" placeholder="例：零件未到、需要主管決定..." style="height:70px"></textarea>

    <!-- Tomorrow plan -->
    <label class="lbl">📋 明日計劃（可選）</label>
    <textarea class="inp" id="planInp" placeholder="例：安裝門刀、進行安全回路測試..." style="height:70px"></textarea>

    <button class="btn-submit" id="submitBtn" onclick="doSubmit()">📤 提交日報</button>
  </div>
</div>

<div id="successScreen" style="display:none;width:100%;max-width:480px">
  <div class="card success">
    <div style="font-size:56px;margin-bottom:12px">✅</div>
    <h2 style="font-size:20px;font-weight:800;color:#22c55e;margin-bottom:8px">日報已提交！</h2>
    <div class="sum" id="sumBox"></div>
    <p style="color:#9aa0b4;font-size:13px">主管已收到，如有問題會聯絡你</p>
    <button onclick="resetForm()" style="width:100%;background:#1e2330;border:1px solid #2a3045;color:#9aa0b4;border-radius:8px;padding:11px;cursor:pointer;font-size:13px;font-weight:600;margin-top:12px">📝 再提交一份</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://fyxvejnvzflxppqrhlzt.supabase.co',SB_KEY='sb_publishable_k9GEEEmqiYnuBPFqsQuvIQ_YGjweOSh';
const EMPS=[
  {id:26,name:'姚奇敏',color:'#FF6B1A'},{id:28,name:'賴偉志',color:'#22C55E'},
  {id:29,name:'韓小錦',color:'#60A5FA'},{id:30,name:'彭金花',color:'#A78BFA'},
  {id:31,name:'李文彪',color:'#FB923C'},{id:32,name:'莫家文',color:'#F43F5E'},
  {id:33,name:'陳文軒',color:'#06B6D4'},{id:43,name:'Simon 曾遠宗',color:'#84CC16'},
  {id:44,name:'Kim',color:'#E879F9'},{id:45,name:'耿華成',color:'#F0C000'},
  {id:46,name:'譚敏銳',color:'#22C55E'},{id:47,name:'吳紹鵬',color:'#60A5FA'},
  {id:48,name:'蔡貴明',color:'#A78BFA'},{id:51,name:'李國森',color:'#FB923C'},
];
let emp=null,status=null;
const p=new URLSearchParams(location.search);
// Support ?emp=ID or ?proj=PROJID for project-specific links
emp=EMPS.find(e=>e.id===parseInt(p.get('emp')||'0'));
const preProj=p.get('proj')||'';

if(!emp){document.getElementById('errorScreen').style.display='block';}
else{
  document.getElementById('mainContent').style.display='block';
  document.getElementById('empName').textContent=emp.name;
  const av=document.getElementById('empAvatar');
  av.textContent=emp.name[0];av.style.background=emp.color+'33';av.style.color=emp.color;av.style.border='2px solid '+emp.color+'66';
  // Pre-select project if in URL
  if(preProj){
    const sel=document.getElementById('projInp');
    for(let o of sel.options){if(o.value.includes(preProj)||o.text.includes(preProj)){o.selected=true;document.getElementById('projName').textContent=o.text;break;}}
  }
  // Default date
  const hk=new Date(Date.now()+8*3600000);
  document.getElementById('dateInp').value=hk.toISOString().slice(0,10);
}

function updPct(){
  const v=document.getElementById('pctSlider').value;
  document.getElementById('pctVal').textContent=v+'%';
  document.getElementById('pctFill').style.width=v+'%';
}
function selStatus(btn){
  document.querySelectorAll('.status-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');status=btn.dataset.s;
}

async function doSubmit(){
  const proj=document.getElementById('projInp').value;
  const work=document.getElementById('workInp').value.trim();
  if(!proj){toast('⚠️ 請選擇工程項目');return;}
  if(!status){toast('⚠️ 請選擇今日狀態');return;}
  if(!work){toast('⚠️ 請填寫今日工作內容');return;}

  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='提交中...';

  const payload={
    employee_name:emp.name,
    project_name:proj,
    report_date:document.getElementById('dateInp').value,
    progress_pct:parseInt(document.getElementById('pctSlider').value),
    status,
    work_done:work,
    issues:document.getElementById('issueInp').value.trim()||null,
    tomorrow_plan:document.getElementById('planInp').value.trim()||null,
    submitted_at:new Date().toISOString()
  };

  try{
    const r=await fetch(`${SB_URL}/rest/v1/progress_reports`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error();
    document.getElementById('mainContent').style.display='none';
    document.getElementById('successScreen').style.display='block';
    const statusIcon={'正常施工':'✅','延誤':'⚠️','待料':'📦','惡劣天氣停工':'🌧','驗收檢查':'🔍','完工':'🏁'};
    document.getElementById('sumBox').innerHTML=`
      <div class="sum-row"><span style="color:#555d6e">負責人</span><span style="font-weight:600">${emp.name}</span></div>
      <div class="sum-row"><span style="color:#555d6e">工程</span><span style="font-weight:600">${proj}</span></div>
      <div class="sum-row"><span style="color:#555d6e">日期</span><span style="font-weight:600">${payload.report_date}</span></div>
      <div class="sum-row"><span style="color:#555d6e">進度</span><span style="font-weight:600;color:#f0c000">${payload.progress_pct}%</span></div>
      <div class="sum-row"><span style="color:#555d6e">狀態</span><span style="font-weight:600">${statusIcon[status]||''} ${status}</span></div>`;
  }catch(e){btn.disabled=false;btn.textContent='📤 提交日報';toast('❌ 提交失敗，請重試');}
}

function resetForm(){
  document.getElementById('successScreen').style.display='none';
  document.getElementById('mainContent').style.display='block';
  document.getElementById('workInp').value='';
  document.getElementById('issueInp').value='';
  document.getElementById('planInp').value='';
  document.getElementById('pctSlider').value=0;updPct();
  document.querySelectorAll('.status-btn').forEach(b=>b.classList.remove('sel'));
  status=null;
  const btn=document.getElementById('submitBtn');btn.disabled=false;btn.textContent='📤 提交日報';
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
